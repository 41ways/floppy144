name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to move the rolling "latest" release

jobs:
  windows-x64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cross-compiling from Linux beats a Windows runner here: the container
      # boots in seconds and mingw-w64 produces the same binary.
      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Build
        run: make

      # The contest limit is a hard gate, so it fails the job rather than
      # warning. The report also lands in the run summary, readable on a phone.
      - name: Disk budget
        run: python3 tools/sizecheck.py dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SOUNDING-win64
          path: dist/
          if-no-files-found: error

      # Artifacts need a GitHub login to download, which is friction when the
      # machine that builds and the machine that plays are different. A rolling
      # release gives one fixed URL that works with no account at all:
      #   https://github.com/41ways/floppy144/releases/download/latest/SOUNDING.exe
      - name: Publish rolling latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s dist/SOUNDING.exe)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/SOUNDING.exe \
            --title "latest" \
            --prerelease \
            --notes "Rolling build of \`${GITHUB_SHA::7}\` — ${SIZE} bytes of 1,474,560.

          Download \`SOUNDING.exe\` below and run it. Click the window once to
          capture the mouse. WASD moves in silence, click sends a ping, Esc
          releases the mouse and a second Esc quits."
